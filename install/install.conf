# ============================================================
# Inference Boot — Install Configuration
# Edit this file before running 00-bootstrap.sh
# ============================================================

# ---- Target drive ----
# Block device for the second NVMe (NOT your gaming OS drive).
# Run: lsblk -d -o NAME,SIZE,MODEL   to identify the correct drive.
# Example: /dev/nvme1n1
TARGET_DRIVE="/dev/nvme1n1"

# Partition layout (sizes in MiB; 0 = use remaining space)
EFI_SIZE=512
SWAP_SIZE=8192       # Set to 0 to disable swap
ROOT_SIZE=0          # 0 = all remaining space

# ---- OS install ----
HOSTNAME="inference-pc"
TIMEZONE="Europe/London"        # timedatectl list-timezones
LOCALE="en_GB.UTF-8"

# ---- User account ----
INFERENCE_USER="inference"
# Password hash — generate with:  openssl passwd -6 'yourpassword'
# Default below is the string: inferenceboot
INFERENCE_PASSWORD_HASH='$6$rounds=656000$xyz$PLACEHOLDER_HASH_CHANGE_ME'

# ---- SSH ----
SSH_PORT=22
# Paste your public key here for passwordless login (recommended).
# Leave empty to rely on password auth (less secure).
SSH_PUBLIC_KEY=""

# ---- GPU backend ----
# Options: nvidia  amd  cpu
# For NVIDIA: requires CUDA-capable card (GTX 900+ / RTX series)
# For AMD:    requires ROCm-capable card (RX 5000+ / RX 6000+ / RX 7000+)
# cpu: runs without GPU (slow, for testing only)
GPU_BACKEND="nvidia"

# NVIDIA driver version (leave blank for latest stable)
NVIDIA_DRIVER_VERSION=""

# AMD ROCm version (leave blank for latest stable)
ROCM_VERSION=""

# ---- Inference stack ----
# Primary engine: ollama  (recommended — GPU-accelerated, OpenAI-compatible API)
INFERENCE_ENGINE="ollama"

# Ollama listen address (0.0.0.0 = all interfaces on the inference OS)
OLLAMA_HOST="0.0.0.0"
OLLAMA_PORT=11434

# Models to pre-pull on first boot (space-separated Ollama model tags).
# Leave empty to skip; you can pull models later with scripts/pull-model.sh
# Examples: llama3.2 mistral phi3 gemma2:9b deepseek-r1:7b
MODELS_TO_PULL="llama3.2"

# Optional OpenAI-compatible reverse proxy on port 8080 (nginx)
# Enables: http://inference-pc.local:8080/v1/...
ENABLE_PROXY=true
PROXY_PORT=8080

# ---- Network ----
# mDNS — makes the server reachable as <HOSTNAME>.local on your LAN
ENABLE_MDNS=true

# Firewall — recommended; opens only SSH + inference API + proxy
ENABLE_FIREWALL=true

# Allow inference API access from this CIDR only (more secure).
# Use 0.0.0.0/0 to allow all LAN hosts, or restrict to e.g. 192.168.1.0/24
ALLOWED_CIDR="0.0.0.0/0"

# Wake-on-LAN from the gaming OS (requires BIOS support)
ENABLE_WOL=true
