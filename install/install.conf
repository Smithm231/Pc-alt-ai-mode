# ============================================================
# Inference Boot — Install Configuration
# Edit this file before running 00-bootstrap.sh
# ============================================================

# ---- Target drive (NVMe — runtime OS) ----
# 500 GB NVMe: inference OS, llama.cpp build, active model, scratch vault.
# Run: lsblk -d -o NAME,SIZE,MODEL   to identify the correct drive.
# This drive WILL be wiped. The gaming-OS drive must NOT appear here.
TARGET_DRIVE="/dev/nvme1n1"

# Partition sizes (MiB; 0 = use remaining space)
EFI_SIZE=512
SWAP_SIZE=8192
ROOT_SIZE=0

# ---- SATA SSD (workspace — not wiped by bootstrap) ----
# 500 GB SATA SSD: model library (all GGUFs), write/execute sandbox, backups.
# Run: lsblk -d -o NAME,SIZE,MODEL,TRAN  to find the SATA drive.
SATA_SSD_DEVICE="/dev/sda"
SATA_SSD_MOUNT="/media/sata-ssd"
MODELS_DIR="${SATA_SSD_MOUNT}/models"          # Full GGUF library (cold store)
SANDBOX_DIR="${SATA_SSD_MOUNT}/sandbox"        # Model write/execute ring-fence
BACKUP_DIR="${SATA_SSD_MOUNT}/backups"         # Tools, briefs, iteration history

# ---- OS install ----
HOSTNAME="inference-pc"
TIMEZONE="Europe/London"
LOCALE="en_GB.UTF-8"

# ---- User account ----
INFERENCE_USER="inference"

# Password hash — generate BEFORE bootstrap with:
#   openssl passwd -6 'your-chosen-password'
# Copy the output (starting with $6$) into the variable below.
# Leaving the placeholder produces a LOCKED account — you will not be able to
# log in without SSH key auth.  Either set a real hash OR set SSH_PUBLIC_KEY.
INFERENCE_PASSWORD_HASH=''

# Paste your SSH public key here for passwordless key-based auth (recommended).
# Example: "ssh-ed25519 AAAA... user@machine"
SSH_PUBLIC_KEY=""

# ---- SSH ----
SSH_PORT=22

# ---- GPU backend ----
# This build targets the Sapphire Nitro+ RX 7900 XTX (gfx1100, RDNA3).
# Valid options: amd  nvidia  cpu
GPU_BACKEND="amd"

# ROCm version to install. ROCm 6.1+ officially supports gfx1100.
# Verify the current ROCm support matrix before changing:
#   https://rocm.docs.amd.com/en/latest/release/gpu_os_support.html
ROCM_VERSION="6.1"

# HSA GPU version override required for gfx1100 on some ROCm 6.x builds.
# Set to "" to disable.  Verify whether the installed ROCm version still
# needs this override for gfx1100 — newer ROCm releases may not.
# Test after install: rocminfo | grep -i gfx1100
HSA_OVERRIDE_GFX_VERSION="11.0.0"

# ---- llama.cpp build ----
# Source is cloned from upstream and built with the AMD HIP (ROCm) backend.
# The Vulkan backend is also built as a side-by-side binary for benchmarking.
#
# CMake flag note (flags changed at b2000 and again at b3000):
#   HIP (ROCm):  -DGGML_HIP=ON          (was -DLLAMA_HIPBLAS=ON before b2000)
#   Vulkan:      -DGGML_VULKAN=ON       (was -DLLAMA_VULKAN=ON before b2000)
# Verify these against the current CMakeLists.txt at build time if the build
# fails — flag names can change between llama.cpp releases.
LLAMACPP_REPO="https://github.com/ggml-org/llama.cpp"
LLAMACPP_INSTALL_DIR="/opt/llama.cpp"

# AMD GPU architecture target for the HIP build.
# gfx1100 = RDNA3 (7900 XTX).  Do not change for this hardware.
AMDGPU_TARGETS="gfx1100"

# ---- Inference server ----
LLAMACPP_HOST="0.0.0.0"
LLAMACPP_PORT=11434

# Context window (tokens).  7900 XTX has 24 GB VRAM — set generously.
CTX_SIZE=8192

# GPU layers to offload.  99 = offload all possible layers to GPU.
N_GPU_LAYERS=99

# Number of parallel request slots (concurrent generation streams).
N_PARALLEL=4

# ---- Active model ----
# The model llama-server loads at start.  This is a symlink on the NVMe
# pointing into MODELS_DIR on the SSD; managed by scripts/swap-model.sh.
# Path on the NVMe (fast, for load latency):
ACTIVE_MODEL_LINK="/opt/inference-boot/models/active.gguf"

# Default model to download and activate on first boot.
# Format: "owner/repo  filename.gguf"
# Leave MODEL_REPO blank to skip automatic download.
MODEL_REPO="bartowski/Llama-3.2-3B-Instruct-GGUF"
MODEL_FILE="Llama-3.2-3B-Instruct-Q8_0.gguf"

# ---- Scratch vault (disposable session memory — NOT canonical) ----
# On the NVMe, tied to the running OS.  Excluded from backups.
SCRATCH_VAULT_DIR="/opt/inference-boot/scratch-vault"

# ---- OpenAI-compatible proxy ----
# nginx reverse proxy exposes /v1/... on PROXY_PORT.
# llama-server already speaks OpenAI format on LLAMACPP_PORT;
# this adds CORS headers and a stable external port.
ENABLE_PROXY=true
PROXY_PORT=8080

# ---- Network ----
ENABLE_MDNS=true

# Inbound allow list — restrict to your LAN subnet.
# 0.0.0.0/0 is NOT acceptable for a production config (see P4 in correction brief).
# Set to your actual subnet, e.g. 192.168.1.0/24
ALLOWED_CIDR="192.168.1.0/24"

# Default-deny outbound (P7).  Only Discord API is allowlisted for the bot.
# The gaming drive is never mounted; the sandbox has no network.
ENABLE_EGRESS_DENY=true

# Discord bot token path — NOT stored in this file.
# Place the token in this file on the inference OS after first boot.
# The file must be owned root:root, mode 0600.
DISCORD_TOKEN_FILE="/etc/inference-boot/discord-token"

# Wake-on-LAN
ENABLE_WOL=true
