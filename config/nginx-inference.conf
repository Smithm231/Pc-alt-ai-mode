# Inference Boot — nginx reverse proxy
# Exposes an OpenAI-compatible API endpoint on __PROXY_PORT__
# Proxies to Ollama on localhost:__OLLAMA_PORT__

server {
    listen __PROXY_PORT__;
    server_name _;

    # Access control (UFW handles LAN restriction; this is defence-in-depth)
    # Uncomment and set to your LAN subnet to restrict at nginx level too:
    # allow 192.168.1.0/24;
    # deny all;

    # CORS — allows browser-based clients on the LAN
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # OpenAI-compatible routes (/v1/chat/completions, /v1/models, etc.)
    location /v1/ {
        proxy_pass         http://127.0.0.1:__OLLAMA_PORT__/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Streaming — do not buffer
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Native Ollama API (/api/...)
    location /api/ {
        proxy_pass         http://127.0.0.1:__OLLAMA_PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:__OLLAMA_PORT__/api/tags;
        proxy_buffering off;
    }

    # Root — redirect to health
    location = / {
        return 302 /health;
    }
}
