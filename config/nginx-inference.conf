# Inference Boot — nginx reverse proxy
# OpenAI-compatible API on __PROXY_PORT__, proxying to llama-server on __LLAMACPP_PORT__

server {
    listen __PROXY_PORT__;
    server_name _;

    # CORS — allows browser-based LAN clients
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # OpenAI-compatible routes — llama-server speaks these natively
    location /v1/ {
        proxy_pass         http://127.0.0.1:__LLAMACPP_PORT__/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Streaming — do not buffer
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:__LLAMACPP_PORT__/v1/models;
        proxy_buffering off;
    }

    location = / {
        return 302 /health;
    }
}
